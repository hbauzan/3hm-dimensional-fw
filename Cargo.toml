[workspace]
resolver = "2"
members = [
    "crates/sf-kernels",
    "crates/sf-storage",
    "crates/sf-proxy",
    "crates/sf-bench",
    "crates/sf-ui",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.91"
license = "Apache-2.0"
authors = ["Héctor Andrés Bauzán Saavedra"]
publish = false

[workspace.dependencies]
# Storage & columnar engine. sf-storage imports Arrow exclusively via
# lancedb::arrow::{arrow_array, arrow_buffer, arrow_schema}. The exact pins
# force the resolver onto 58.0.0 (caret "58.0.0" would float inside ^58).
# `remote` is required to compile 0.40.0: `Error::Http` is cfg-gated but `job.rs` names it unconditionally.
lancedb = { version = "0.40.0", default-features = false, features = ["remote"] }
# `=58.0.0` does not resolve: datafusion 54 (pulled by lancedb 0.40.0) requires arrow-schema ^58.3.0.
# 58.4.1 is the newest 58.x that satisfies that floor and stays off Arrow 60.
arrow-array = "=58.4.1"
arrow-buffer = "=58.4.1"
arrow-schema = "=58.4.1"

# Async runtime & HTTP/gRPC proxy
tokio = { version = "1.43.0", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal", "io-util"] }
tokio-stream = "0.1.17"
axum = { version = "0.8.1", features = ["http1", "http2", "json"] }
reqwest = { version = "0.12.12", default-features = false, features = ["json", "stream", "http2", "rustls-tls"] }
# 0.14 matches the prost/tonic line that `lancedb` `remote` pulls. 0.12/0.13 cannot unify with it.
tonic = { version = "0.14", features = ["transport"] }
tonic-build = "0.14"
tonic-prost-build = "0.14"
tonic-prost = "0.14"
prost = "0.14"
prost-build = "0.14"
bytes = "1.10.0"
futures-util = "0.3.31"
async-trait = "0.1.86"
tower = { version = "0.5.2", features = ["util"] }
tower-http = { version = "0.6.11", default-features = false, features = ["cors"] }

# Concurrency, crypto & serialization
arc-swap = "1.7.1"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = "1.0.138"
sha2 = "0.10.8"
clap = { version = "4.5.23", features = ["derive"] }
half = "2.4.1"
unicode-normalization = "0.1.24"
base64 = "0.22.1"

# Benchmarking & deterministic RNG
criterion = { version = "0.5.1", features = ["html_reports"] }
hdrhistogram = "7.5.4"
rand = "0.8.5"
rand_chacha = "0.3.1"

[profile.dev]
debug = 0
split-debuginfo = "unpacked"

[profile.dev.package.sf-kernels]
opt-level = 3

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = "abort"
strip = "symbols"

[profile.bench]
inherits = "release"
lto = "thin"
codegen-units = 1

[profile.release.package.sf-kernels]
opt-level = 3
codegen-units = 1

