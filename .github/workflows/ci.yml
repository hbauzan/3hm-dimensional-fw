name: ci

"on":
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust-x86_64:
    runs-on: ubuntu-latest
    # Compiles avx2.rs and avx512.rs (`#[cfg(target_arch = "x86_64")]` in
    # crates/sf-kernels/src/simd/mod.rs). Dispatch uses avx512f when the runner
    # exposes it, otherwise AVX2+FMA. The job does not record which path ran.
    # An arm64 host executes NEON and does not run avx512f.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      # sf-proxy build.rs compiles proto/tei.proto and needs protoc on PATH.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  rust-arm64:
    runs-on: macos-latest
    # The arm64 job is the NEON build.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.94.1
        uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      # sf-proxy build.rs compiles proto/tei.proto and needs protoc on PATH.
      - name: Install protoc
        run: brew install protobuf

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Lint
        run: pnpm --dir frontend lint

      - name: Build
        run: pnpm --dir frontend build

      - name: Test
        run: pnpm --dir frontend test
